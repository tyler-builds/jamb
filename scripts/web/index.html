<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>jamb</title>
<!-- The font every text can be drawn with, which the app waits for before its
     first frame: fetched while the app downloads (see internal/text/fonts_js.go). -->
<link rel="preload" href="fonts/Go-Regular.ttf" as="fetch" crossorigin>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; color: #555; }
  @media (prefers-color-scheme: dark) { html, body { background: #18181b; color: #a1a1aa; } }
  #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 12px; padding: 24px; text-align: center; font: 15px/1.5 system-ui, sans-serif; }
  #status pre { margin: 0; max-width: 90vw; font-size: 12px; text-align: left; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="status" role="status">Loading…</div>
<script src="wasm_exec.js"></script>
<script src="jamb.js"></script>
<script>
// Loads app.wasm, a js build of a jamb app, which draws into a canvas that it
// adds to the page (or into <canvas id="jamb">, when the page has one). When the
// app stops because of an error, the page says so, with the error and the top of
// its stack, which a phone has no other way to show.
(() => {
  Error.stackTraceLimit = 100000; // the whole stack, so its depth shows
  const status = document.getElementById("status");
  let stopped = false;
  const stop = (err) => {
    if (stopped) return;
    stopped = true;
    console.error(err);
    for (const c of document.querySelectorAll("canvas")) c.remove();
    status.textContent = "This app stopped because of an error. Reload the page to start it again.";
    const stack = String((err && err.stack) || "").split("\n");
    const detail = document.createElement("pre");
    detail.textContent = String(err) + "\n" + stack.length + " frames, deepest first:\n" + stack.slice(0, 4).join("\n");
    status.appendChild(detail);
    document.body.appendChild(status);
  };
  addEventListener("error", (e) => {
    // An error from a script of another origin arrives as "Script error." with
    // no error and no file: a browser's or an extension's own script, such as
    // those Firefox for iOS adds to pages. The app's scripts are this page's.
    if (!e.error && !(e.filename || "").startsWith(location.origin)) {
      console.warn("ignored an error from another script:", e.message);
      return;
    }
    stop(e.error || e.message);
  });
  addEventListener("unhandledrejection", (e) => stop(e.reason));
  (async () => {
    const go = new Go();
    let result;
    try {
      result = await WebAssembly.instantiateStreaming(fetch("app.wasm"), go.importObject);
    } catch {
      // A server that does not send application/wasm: compile from the bytes.
      const bytes = await (await fetch("app.wasm")).arrayBuffer();
      result = await WebAssembly.instantiate(bytes, go.importObject);
    }
    status.remove();
    // The host script delivers the app's frames and input (see jamb.js).
    jambHost.attach(result.instance);
    await go.run(result.instance);
  })().catch(stop);
})();
</script>
</body>
</html>
